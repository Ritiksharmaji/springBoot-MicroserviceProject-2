spring.application.name=scalerProject_1
productservice.type = fakeStoreProductService

#fakeStore config values
fakestore.api.url=https://fakestoreapi.com
fakestore.api.paths.product=/products

## =========database connection===============
spring.datasource.url=jdbc:mysql://localhost:3306/scalerSpringboot1
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Let Hibernate create/update tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log SQL statements
logging.level.org.hibernate.SQL=DEBUG
# Connection pool (optional)
#spring.datasource.hikari.maximum-pool-size=10

# Flyway (defaults are fine, but explicit is clearer)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true     # useful for existing DBs
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true